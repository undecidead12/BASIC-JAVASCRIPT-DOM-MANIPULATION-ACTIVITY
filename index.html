<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager | Double‑click to edit quantity</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
        }
        body {
            background: #eef2f5;
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .inventory-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0 0 0.3rem 0;
            color: #1e2f3e;
        }
        .sub {
            color: #5b6e8c;
            margin-bottom: 1.8rem;
        }
        .add-section {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .add-section input {
            flex: 2;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 2rem;
            font-size: 1rem;
        }
        .add-section button {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 0 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-section button:hover {
            background: #1f5e7a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 1rem 0.5rem;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            color: #2c3e50;
        }
        .quantity-cell {
            cursor: pointer;
            background: #f1f5f9;
            border-radius: 1rem;
            text-align: center;
            font-weight: 600;
            transition: 0.1s;
        }
        .quantity-cell:hover {
            background: #e2e8f0;
        }
        .inline-input {
            width: 80px;
            padding: 6px;
            text-align: center;
            border: 2px solid #2c7da0;
            border-radius: 1rem;
            font-weight: 600;
        }
        .delete-btn {
            background: #fee2e2;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 1.5rem;
            cursor: pointer;
            color: #b91c1c;
        }
        .empty-msg {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
<div class="inventory-container">
    <h1>📦 Inventory Management</h1>
    <div class="sub">Double‑click on any quantity to edit it</div>

    <div class="add-section">
        <input type="text" id="itemName" placeholder="Item name (e.g., Laptop, Mouse)">
        <input type="number" id="itemQty" placeholder="Initial quantity" value="1" min="0">
        <button id="addBtn">➕ Add Item</button>
    </div>

    <table id="inventoryTable">
        <thead>
            <tr><th>Item Name</th><th>Quantity</th><th style="width:100px">Action</th></tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
    </table>
    <div id="emptyMsg" class="empty-msg">No items yet. Add your first product.</div>
</div>

<script>
    // Inventory array: each item = { id, name, quantity }
    let inventory = [];
    let nextId = 1;

    const inventoryBody = document.getElementById('inventoryBody');
    const emptyMsg = document.getElementById('emptyMsg');
    const itemNameInput = document.getElementById('itemName');
    const itemQtyInput = document.getElementById('itemQty');
    const addBtn = document.getElementById('addBtn');

    // Helper: render the table
    function renderInventory() {
        inventoryBody.innerHTML = '';
        if (inventory.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';

        inventory.forEach(item => {
            const row = document.createElement('tr');
            // Name cell
            const nameCell = document.createElement('td');
            nameCell.textContent = item.name;
            nameCell.style.fontWeight = '500';
            // Quantity cell (double‑click to edit)
            const qtyCell = document.createElement('td');
            qtyCell.className = 'quantity-cell';
            qtyCell.textContent = item.quantity;
            qtyCell.setAttribute('data-id', item.id);
            qtyCell.setAttribute('data-value', item.quantity);
            // double‑click handler
            qtyCell.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                // Already editing? avoid double editing
                if (qtyCell.querySelector('input')) return;
                const currentQty = item.quantity;
                const input = document.createElement('input');
                input.type = 'number';
                input.value = currentQty;
                input.min = 0;
                input.className = 'inline-input';
                input.addEventListener('blur', () => {
                    const newQty = parseInt(input.value, 10);
                    if (!isNaN(newQty) && newQty >= 0) {
                        item.quantity = newQty;
                        renderInventory();  // re-render to reflect changes
                    } else {
                        renderInventory(); // revert
                    }
                });
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        input.blur();
                    }
                });
                qtyCell.innerHTML = '';
                qtyCell.appendChild(input);
                input.focus();
            });
            // Delete button
            const actionCell = document.createElement('td');
            const delBtn = document.createElement('button');
            delBtn.textContent = '🗑️ Delete';
            delBtn.className = 'delete-btn';
            delBtn.addEventListener('click', () => {
                inventory = inventory.filter(i => i.id !== item.id);
                renderInventory();
            });
            actionCell.appendChild(delBtn);

            row.appendChild(nameCell);
            row.appendChild(qtyCell);
            row.appendChild(actionCell);
            inventoryBody.appendChild(row);
        });
    }

    // Add new item
    function addItem() {
        const name = itemNameInput.value.trim();
        let quantity = parseInt(itemQtyInput.value, 10);
        if (name === '') {
            alert('Please enter an item name.');
            return;
        }
        if (isNaN(quantity) || quantity < 0) quantity = 0;
        const newItem = {
            id: nextId++,
            name: name,
            quantity: quantity
        };
        inventory.push(newItem);
        renderInventory();
        // Clear inputs
        itemNameInput.value = '';
        itemQtyInput.value = '1';
        itemNameInput.focus();
    }

    addBtn.addEventListener('click', addItem);
    // Allow Enter key to add
    itemNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addItem();
    });
    itemQtyInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addItem();
    });

    // Initial demo items
    inventory = [
        { id: nextId++, name: 'Notebook', quantity: 12 },
        { id: nextId++, name: 'Pen', quantity: 45 },
        { id: nextId++, name: 'Stapler', quantity: 7 }
    ];
    renderInventory();
</script>
</body>
</html>
